name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secrets
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KSP: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.RELEASE_KEY_ALIAS }}
          KP: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          missing=""
          [ -z "$KS" ] && missing="$missing RELEASE_KEYSTORE_BASE64"
          [ -z "$KSP" ] && missing="$missing RELEASE_KEYSTORE_PASSWORD"
          [ -z "$KA" ] && missing="$missing RELEASE_KEY_ALIAS"
          [ -z "$KP" ] && missing="$missing RELEASE_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Release signing secrets are not configured:$missing. Unsigned APKs are never published. See README (Release 署名の設定)."
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Derive version from tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          IFS='.-' read -r MAJ MIN PAT _ <<< "${VERSION}"
          CODE=$(( ${MAJ:-0} * 10000 + ${MIN:-0} * 100 + ${PAT:-0} ))
          echo "C2M_VERSION_NAME=${VERSION}" >> "$GITHUB_ENV"
          echo "C2M_VERSION_CODE=${CODE}" >> "$GITHUB_ENV"
          echo "version ${VERSION} code ${CODE}"

      - name: Decode keystore
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "C2M_RELEASE_STORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Test and build signed release APK
        env:
          C2M_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          C2M_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          C2M_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Verify signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Signed release APK not found (unsigned build?)"; ls app/build/outputs/apk/release/; exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --verbose --print-certs "$APK"
          mkdir -p dist
          cp "$APK" "dist/C2Mirror-${C2M_VERSION_NAME}.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "C2Mirror ${C2M_VERSION_NAME}" \
            --notes "署名済み Release APK。インストール方法は README を参照してください。実機検証状況は docs/IMPLEMENTATION_STATUS.md を参照。" \
            --verify-tag
