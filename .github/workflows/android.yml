name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon lintDebug

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: |
          SHORT_SHA=$(echo "${GITHUB_SHA}" | cut -c1-7)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/C2Mirror-debug-${SHORT_SHA}.apk"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: C2Mirror-debug-apk
          path: dist/*.apk
          if-no-files-found: error

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore
